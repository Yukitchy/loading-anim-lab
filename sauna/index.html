<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAUNA MAP — Loading studies</title>
<style>
:root{--cream:#F4EDDC;--ink:#38271A;--green:#5C7231;--gold:#D9B36A;--line:#38271a25}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Helvetica Neue",Arial,"Noto Sans JP","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}header,main,.footer-note{max-width:1320px;margin:auto;padding-left:40px;padding-right:40px}.topline{display:flex;justify-content:space-between;align-items:center;padding:30px 0 24px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:2px}.brand{font-size:17px;font-weight:700;letter-spacing:2px}.brand span{color:var(--green);margin-right:9px}.intro{padding:48px 0 30px}.eyebrow{font-size:10px;letter-spacing:2.4px;color:var(--green);font-weight:700}h1{font-size:clamp(25px,3vw,40px);font-weight:500;letter-spacing:.04em;white-space:nowrap;margin:14px 0 16px}h1 em{font-family:Georgia,serif;font-style:italic;color:var(--green)}.intro p{font-size:13px;line-height:1.9;margin:0;color:#766450}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0 26px;border-bottom:1px solid var(--line);font-size:12px}.timing{display:flex;align-items:center;gap:16px}.segmented{display:flex;padding:4px;background:#e8dfcd;border-radius:6px;gap:2px}.segmented button{border:0;background:none;padding:8px 15px;font-size:12px;border-radius:3px}.segmented button[aria-pressed=true]{background:var(--ink);color:var(--cream);box-shadow:0 2px 5px #38271a15}.hint{font-size:11px;color:#7b6a55}.hint:before{content:"";display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 28px;padding:34px 0 50px}.concept{min-width:0}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.number{font-size:11px;letter-spacing:1px}.mood{font-family:Georgia,serif;font-size:12px;font-style:italic;color:#86735b}.phone{width:100%;max-width:390px;aspect-ratio:390/600;position:relative;border:6px solid #e2d7c3;border-radius:29px;overflow:hidden;background:#fbf8ef;box-shadow:0 12px 28px #38271a09;margin:auto}.status{position:absolute;top:0;left:0;right:0;height:43px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:10px;z-index:3;pointer-events:none}.status b{font-size:11px}.status i{font-style:normal;letter-spacing:1px;font-size:10px}.home-indicator{position:absolute;bottom:9px;left:36%;width:28%;height:4px;background:var(--ink);opacity:.7;border-radius:4px;z-index:3}.overlay{position:absolute;inset:0;background:#eee3cf;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:1;transition:opacity .55s cubic-bezier(.22,.61,.36,1);z-index:2}.overlay:before{content:"";position:absolute;inset:0;opacity:.38;background:repeating-linear-gradient(90deg,transparent 0,transparent 63px,#bba17b15 64px,transparent 65px);pointer-events:none}.overlay.hidden{opacity:0;pointer-events:none}.art{width:190px;height:180px;overflow:visible;position:relative}.load-brand{font-size:19px;letter-spacing:3.5px;font-weight:600;margin-top:22px}.load-copy{font-size:10px;letter-spacing:2px;margin-top:12px;color:#867257}.loading-dots{display:flex;gap:5px;margin-top:25px}.loading-dots i{width:3px;height:3px;background:var(--green);border-radius:50%;animation:dot 2s infinite}.loading-dots i:nth-child(2){animation-delay:.2s}.loading-dots i:nth-child(3){animation-delay:.4s}.inside{padding:60px 22px 20px;height:100%;background:#faf7ef}.inside-logo{font-size:15px;letter-spacing:2px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:18px}.inside small{display:block;font-size:9px;letter-spacing:2px;color:var(--green);margin-top:27px}.inside h3{font-size:23px;line-height:1.6;font-weight:500;margin:12px 0 19px}.map{height:145px;background:#e8e8d4;position:relative;overflow:hidden;border-radius:4px}.map:before,.map:after{content:"";position:absolute;width:150%;height:18px;background:#f9f6e9;transform:rotate(-35deg);top:54px;left:-30px;box-shadow:0 45px 0 #f9f6e9}.map:after{transform:rotate(48deg);height:12px;top:50px}.pin{position:absolute;left:48%;top:51px;z-index:1;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--green);transform:rotate(-45deg);border:5px solid #fff}.inside-caption{font-size:11px;line-height:1.8;margin-top:18px}.demo-label{font-size:8px!important;margin-top:20px!important;color:#8c7d68!important}.details{padding-top:19px}.details h2{font-size:18px;font-weight:500;margin:0 0 9px;letter-spacing:.05em}.details p{font-size:12px;color:#7a6753;line-height:1.85;min-height:45px;margin:0 0 17px}.actions{display:flex;gap:9px}.actions button{height:39px;border:1px solid #c9bda7;border-radius:4px;background:transparent;font-size:11px;transition:background .2s}.replay{flex:1}.actions button:hover{background:#e6dbc6}.footer-note{font-size:10px;color:#8a775e;margin-bottom:120px;line-height:1.8}.steam{fill:none;stroke:#fffaf0;stroke-width:5;stroke-linecap:round;stroke-dasharray:65 100;animation:steam 3.4s infinite cubic-bezier(.4,0,.2,1)}.steam.s2{animation-delay:-1.1s}.steam.s3{animation-delay:-2.2s}.pour{transform-origin:150px 46px;animation:pour 3.8s infinite}.water-drop{fill:#9cbdc5;animation:drop 3.8s infinite}.heat-glow{animation:glow 3.8s infinite}.vapor{animation:vapor 4.8s ease-in-out infinite;transform-origin:center}.vapor.two{animation-delay:-1.6s}.vapor.three{animation-delay:-3.2s}.ripple{fill:none;stroke:#739aa8;stroke-width:1.5;transform-origin:100px 123px;animation:ripple 3.6s infinite}.ripple.r2{animation-delay:-1.2s}.ripple.r3{animation-delay:-2.4s}.bather{animation:dip 3.6s infinite cubic-bezier(.45,0,.25,1)}.splash{animation:splash 3.6s infinite;transform-origin:100px 110px}.towel{transform-origin:68px 110px;animation:fan 2.8s infinite cubic-bezier(.45,0,.25,1)}.wind{fill:none;stroke:#fffaf0;stroke-width:2;stroke-linecap:round;stroke-dasharray:70;animation:wind 2.8s infinite}.wind.w2{animation-delay:.15s}.mercury{transform-origin:100px 131px;animation:temperature 4s infinite cubic-bezier(.65,0,.35,1)}.temp-rays{transform-origin:100px 80px;animation:glow 4s infinite}.float-caption{font-size:9px;letter-spacing:2px;fill:#968367}@keyframes dot{0%,70%,100%{opacity:.25}35%{opacity:1}}@keyframes steam{0%{stroke-dashoffset:70;opacity:0;transform:translateY(10px)}30%{opacity:.9}85%,100%{stroke-dashoffset:-65;opacity:0;transform:translateY(-12px)}}@keyframes pour{0%,12%,75%,100%{transform:rotate(0)}30%,48%{transform:rotate(-24deg)}}@keyframes drop{0%,23%,58%,100%{opacity:0;transform:translateY(-5px)}30%{opacity:1}50%{opacity:0;transform:translate(-10px,44px)}}@keyframes glow{0%,100%{opacity:.35}45%,65%{opacity:1}}@keyframes vapor{0%{opacity:0;transform:translateY(25px) scaleX(.8)}25%,55%{opacity:.9}100%{opacity:0;transform:translateY(-40px) scaleX(1.15)}}@keyframes ripple{0%{transform:scale(.25);opacity:0}20%{opacity:.8}100%{transform:scale(1.3);opacity:0}}@keyframes dip{0%,100%{transform:translateY(-5px)}35%,65%{transform:translateY(15px)}}@keyframes splash{0%,20%,70%,100%{opacity:0;transform:scale(.5)}38%{opacity:1;transform:scale(1)}60%{opacity:0;transform:translateY(8px) scale(1.2)}}@keyframes fan{0%,100%{transform:rotate(-16deg)}45%{transform:rotate(22deg)}65%{transform:rotate(10deg)}}@keyframes wind{0%,25%{opacity:0;stroke-dashoffset:70;transform:translateX(-10px)}45%{opacity:.9}85%,100%{opacity:0;stroke-dashoffset:-70;transform:translateX(15px)}}@keyframes temperature{0%,100%{transform:scaleY(.25)}55%,75%{transform:scaleY(1)}}
@media(min-width:1300px){.grid{gap:48px 35px}}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header,main,.footer-note{padding-left:20px;padding-right:20px}.topline{padding:23px 0 20px}.topline>span{font-size:8px;letter-spacing:1px}.brand{font-size:14px}.intro{padding:33px 0 25px}h1{font-size:27px;letter-spacing:0}.intro p{font-size:12px}.toolbar{align-items:flex-start;flex-direction:column;gap:13px;padding:17px 0 21px}.timing{width:100%;justify-content:space-between;gap:8px}.segmented button{padding:8px 14px}.hint{font-size:10px}.grid{grid-template-columns:minmax(0,1fr);gap:35px;padding-top:27px}.phone{aspect-ratio:390/580}.details p{min-height:0}.details h2{font-size:19px}.actions button{height:43px}.footer-note{margin-bottom:115px}}
@media(prefers-reduced-motion:reduce){.art *,.loading-dots i{animation-duration:8s!important}.overlay{transition-duration:.15s}}
</style>
</head>
<body>
<header><div class="topline"><div class="brand"><span>♨</span>SAUNA MAP</div><span>DESIGN STUDIES / 2026</span></div><div class="intro"><div class="eyebrow">A MOMENT BEFORE THE SAUNA</div><h1>ととのう前の、<em>ひと呼吸。</em></h1><p>SAUNA MAP ローディングアニメーション 5案。<br>お気に入りの待ち時間を、見つけてください。</p></div><div class="toolbar"><div class="timing"><span>オーバーレイ表示時間</span><div class="segmented" role="group" aria-label="共通の表示時間"><button data-time="1200" aria-pressed="false">1.2秒</button><button data-time="1700" aria-pressed="true">1.7秒</button><button data-time="2400" aria-pressed="false">2.4秒</button></div></div><span class="hint">通常はループ表示 ／「再生」で画面が開く流れを確認</span></div></header>
<main><div class="grid" id="grid"></div></main>
<p class="footer-note">※ 読み込み後の画面は共通のデモです。表示時間の後に、約0.55秒でフェードアウトします。</p>
<script>
const concepts=[
{name:'石に、ひとしずく。',en:'Löyly',desc:'水を注ぐ、その一瞬。熱い石から白い蒸気がふわっと広がります。',copy:'ぬくもりを、準備中',art:`<ellipse cx="100" cy="151" rx="65" ry="6" fill="#38271a0c"/><path d="M53 118h94l-8 28H61z" fill="#a78b62"/><path d="M64 122v19m18-19v19m18-19v19m18-19v19m18-19v19" stroke="#eee3cf" stroke-width="2"/><g class="heat-glow" fill="#D9B36A"><ellipse cx="83" cy="111" rx="23" ry="11"/><ellipse cx="117" cy="112" rx="26" ry="12"/></g><g fill="#6d6656" stroke="#eee3cf" stroke-width="2"><path d="M57 113q-3-18 18-18q17 0 20 19z"/><path d="M91 115q-6-26 17-25q22 1 21 25z"/><path d="M122 117q-6-19 8-21q19-1 20 21z"/></g><path class="steam" d="M79 94c-18-20 18-23 2-45"/><path class="steam s2" d="M103 91c-17-22 18-31 2-52"/><g class="pour" stroke="#806641" stroke-width="3" fill="#D9B36A"><path d="M133 43l39-19" stroke-linecap="round"/><path d="M112 48q12-12 28-4l-3 14q-16 10-25-10z"/></g><path class="water-drop" d="M119 59q-9 12-5 16q10 5 5-16"/>`},
{name:'湯気の、深呼吸。',en:'Slow steam',desc:'ゆらぎながら、静かに昇る湯気。余白とゆっくりした動きで、心をほどきます。',copy:'ひと息、つきましょう',art:`<ellipse cx="100" cy="146" rx="61" ry="5" fill="#38271a0b"/><path d="M59 124q41 13 82 0l-7 19H66z" fill="#c6aa7a"/><ellipse cx="100" cy="124" rx="41" ry="8" fill="#dbbf91"/><ellipse cx="100" cy="123" rx="33" ry="4" fill="#eee3cf"/><g fill="none" stroke="#fffaf0" stroke-width="8" stroke-linecap="round"><path class="vapor" d="M77 107c-27-27 25-34 0-63"/><path class="vapor two" d="M100 110c-26-29 27-37 1-74"/><path class="vapor three" d="M124 108c-24-27 24-36 1-63"/></g>`},
{name:'ざぶんと、リセット。',en:'Cold plunge',desc:'水風呂に身を沈めて、波紋がすうっと外へ。ひんやり、爽やかな切り替え。',copy:'気分を、リセット中',art:`<ellipse cx="100" cy="125" rx="74" ry="30" fill="#d0e0df"/><ellipse cx="100" cy="125" rx="74" ry="30" fill="none" stroke="#91aeb3" stroke-width="2"/><ellipse class="ripple" cx="100" cy="123" rx="51" ry="17"/><ellipse class="ripple r2" cx="100" cy="123" rx="51" ry="17"/><g class="bather" fill="#b99a6c"><circle cx="100" cy="76" r="13"/><path d="M78 113v-9q22-19 44 0v9q-22 7-44 0"/></g><path d="M61 120q39 12 78 0v17q-39 20-78 0z" fill="#d0e0df"/><ellipse class="ripple r3" cx="100" cy="123" rx="51" ry="17"/><g class="splash" stroke="#739aa8" stroke-width="2" stroke-linecap="round"><path d="M65 105l-7-9m78 9l7-9m-74-4l-3-10m64 10l3-10"/></g>`},
{name:'風を、ひと振り。',en:'Aufguss',desc:'しなやかなタオルから、やわらかな風。心地よい熱が、画面いっぱいに届きます。',copy:'心地よい風を、お届け',art:`<circle cx="94" cy="95" r="64" fill="none" stroke="#d9b36a" stroke-opacity=".25"/><g class="towel"><path d="M62 111q10-51 37-67q3 30 43 37q-31 6-40 48q-19-19-40-18" fill="#fff9e9" stroke="#bca57d" stroke-width="1.5"/><path d="M68 108q26-17 31-57m-14 58q9-21 42-28" fill="none" stroke="#ddcaa7" stroke-width="1.5"/><path d="M56 119l12-12" stroke="#806641" stroke-width="8" stroke-linecap="round"/></g><path class="wind" d="M117 115q37-9 46-32"/><path class="wind w2" d="M112 133q50-6 61-32"/><path class="wind" d="M98 148q42 3 60-17"/>`},
{name:'じんわり、適温へ。',en:'Warm up',desc:'温度計がゆっくり上昇。じんわり満ちる熱で、サウナへの期待を高めます。',copy:'ととのう温度へ、もう少し',art:`<g stroke="#a78b62" stroke-width="2" fill="none"><path d="M87 122V43a13 13 0 0 1 26 0v79a24 24 0 1 1-26 0z"/><path d="M124 48h12m-12 18h7m-7 18h12m-12 18h7"/></g><path d="M100 53v80" stroke="#dfcfaf" stroke-width="8" stroke-linecap="round"/><path class="mercury" d="M100 53v80" stroke="#D9B36A" stroke-width="8" stroke-linecap="round"/><circle cx="100" cy="140" r="15" fill="#D9B36A"/><g class="temp-rays" stroke="#D9B36A" stroke-width="2" stroke-linecap="round"><path d="M67 49l-7-5m7 26H55m12 21l-7 5"/></g>`}
];
const grid=document.getElementById('grid');let duration=1700;const timers=new Map();
concepts.forEach((c,i)=>{const card=document.createElement('article');card.className='concept';card.innerHTML=`<div class="card-top"><span class="number">案${i+1} <span style="opacity:.35;margin-left:9px">/ 0${i+1}</span></span><span class="mood">${c.en}</span></div><div class="phone"><div class="status"><b>9:41</b><i>▮▮▮ ▰</i></div><div class="inside"><div class="inside-logo">SAUNA MAP</div><small>FIND YOUR NEXT SAUNA</small><h3>今日の、ととのいを<br>見つけよう。</h3><div class="map"><span class="pin"></span></div><div class="inside-caption">お気に入りのサウナと、<br>心地よかった時間を記録する。</div><small class="demo-label">読み込み後の画面イメージ / DEMO</small></div><div class="overlay" aria-label="${c.name} ローディング"><svg class="art" viewBox="0 0 200 180" aria-hidden="true">${c.art}</svg><div class="load-brand">SAUNA MAP</div><div class="load-copy">${c.copy}</div><div class="loading-dots"><i></i><i></i><i></i></div></div><div class="home-indicator"></div></div><div class="details"><h2>${c.name}</h2><p>${c.desc}</p><div class="actions"><button class="replay" aria-label="案${i+1}を再生">▷ 再生</button></div></div>`;grid.appendChild(card);card.querySelector('.replay').addEventListener('click',()=>{clearTimeout(timers.get(i));const overlay=card.querySelector('.overlay');overlay.classList.remove('hidden');overlay.getAnimations({subtree:true}).forEach(a=>{if(a.effect instanceof KeyframeEffect&&a.effect.target!==overlay)a.currentTime=0});const b=card.querySelector('.replay');b.textContent='↻ もう一度再生';timers.set(i,setTimeout(()=>overlay.classList.add('hidden'),duration))});});
document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{duration=+button.dataset.time;document.querySelectorAll('[data-time]').forEach(b=>b.setAttribute('aria-pressed',b===button))}));
</script>
</body></html>

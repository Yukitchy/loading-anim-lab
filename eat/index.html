<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EAT MAP ローディング｜クローシュ5案</title>
<style>
:root{
  --bg:#F1EFEA; --ink:#121212; --g:#1B8A3F; --sub:#5D5A54;
  --line:#DCD8D0; --chip:#E4E1DA;
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","YuGothic",Meiryo,"Segoe UI",sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased;
  overflow-x:clip;padding-bottom:110px;
}
p,span,b,button,h1,h2,div{word-break:auto-phrase;line-break:strict}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:6px}

/* ---------- header ---------- */
.top{max-width:1320px;margin:0 auto;padding:30px 16px 18px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--g)}
h1{font-size:clamp(17px,4.5vw,28px);line-height:1.35;font-weight:800;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.lead{font-size:14px;color:var(--sub);max-width:62ch;margin-top:8px;text-wrap:pretty}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(241,239,234,.88);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toolbar .in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.toolbar .lab{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;color:var(--sub);
  font-variant-numeric:tabular-nums;transition:background .2s var(--out),color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.allplay{margin-left:auto;height:38px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--ink);white-space:nowrap;transition:transform .12s var(--spring)}
.allplay:active{transform:scale(.97)}
@media(max-width:420px){.toolbar .lab{display:none}.seg button{padding:0 12px}}

/* ---------- grid ---------- */
main{max-width:1320px;margin:0 auto;padding:28px 16px 40px;display:grid;gap:56px 28px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,404px),1fr));justify-items:center}
.card{width:100%;max-width:404px;display:flex;flex-direction:column;gap:14px}
.c-no{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--g)}
.c-no span{color:var(--sub);letter-spacing:.06em;font-weight:700;margin-left:8px}
.card h2{font-size:21px;line-height:1.4;margin-top:2px}
.card .desc{font-size:14px;color:var(--sub);margin-top:4px;text-wrap:pretty}
.spec{display:flex;flex-wrap:wrap;gap:6px 6px;margin-top:10px}
.spec span{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--chip);color:#3B3935;white-space:nowrap}

.acts{display:flex;gap:10px}
.btn{flex:1;height:48px;border-radius:999px;font-size:15px;font-weight:700;
  transition:transform .12s var(--spring),background .25s var(--out),color .25s,box-shadow .25s}
.btn:active{transform:scale(.97)}
.btn.play{background:var(--ink);color:var(--bg)}
.btn.pick{box-shadow:inset 0 0 0 1.5px var(--ink)}
.card.sel .btn.pick{background:var(--g);color:#fff;box-shadow:none}
.back{align-self:center;font-size:13px;font-weight:700;color:var(--sub);height:28px;padding:0 8px;
  opacity:0;pointer-events:none;transition:opacity .3s}
.card.shown .back{opacity:1;pointer-events:auto}

/* ---------- phone ---------- */
.phone{width:100%;background:#121212;border-radius:52px;padding:7px;
  box-shadow:0 2px 4px rgba(18,18,18,.08),0 28px 50px -16px rgba(18,18,18,.32);
  outline:3px solid transparent;outline-offset:6px;transition:outline-color .35s var(--out)}
.card.sel .phone{outline-color:var(--g)}
.screen{position:relative;aspect-ratio:390/800;border-radius:45px;overflow:hidden;background:var(--bg);isolation:isolate}
.island{position:absolute;top:11px;left:50%;width:110px;height:32px;margin-left:-55px;background:#121212;border-radius:999px;z-index:7}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:6px 30px 0 38px;font-size:15px;font-weight:700;z-index:6;font-variant-numeric:tabular-nums;pointer-events:none}
.sb svg{display:block}
.sb .ic{display:flex;gap:6px;align-items:center}

/* app (content under the overlay) */
.app{position:absolute;inset:0;padding:60px 18px 0;display:flex;flex-direction:column;gap:14px}
.a-head{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:17px;font-weight:800;letter-spacing:.16em;display:flex;align-items:center;gap:8px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--g)}
.me{width:34px;height:34px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.search{height:46px;border-radius:999px;background:#FBFAF7;display:flex;align-items:center;gap:10px;padding:0 18px;
  font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden}
.chips{display:flex;gap:8px;overflow:hidden}
.chip{padding:6px 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}
.map{flex:1 1 auto;min-height:120px;border-radius:22px;overflow:hidden;background:#E5E1D8;position:relative}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.sheet{padding-bottom:22px}
.sh-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.sh-h b{font-size:16px}
.sh-h span{font-size:13px;color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.sh-h + .row{border-top:0}
.thumb{width:46px;height:46px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.rt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{font-size:13px;color:var(--sub);white-space:nowrap}
.rate{font-size:14px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}

/* overlay */
.ov{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding-bottom:36px}
.stage{width:236px;will-change:transform}
.stage svg{display:block;width:100%;height:auto;overflow:visible}
.brand{text-align:center;will-change:opacity}
.wm{font-size:15px;font-weight:800;letter-spacing:.34em;padding-left:.34em;display:flex;align-items:center;justify-content:center;gap:2px}
.tag{font-size:13px;color:var(--sub);letter-spacing:.08em;margin-top:2px}
.bar{width:96px;height:2px;border-radius:2px;background:#DCD8D0;margin:14px auto 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);transform-origin:0 50%;transform:scaleX(0)}

/* svg animation helpers */
.tb{transform-box:view-box}
.fb{transform-box:fill-box;transform-origin:50% 50%}
.wisp{fill:none;stroke:#B9B5AD;stroke-width:4;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 100%;
  opacity:0;animation:wisp 3.4s cubic-bezier(.33,0,.2,1) infinite}
.wisp:nth-child(2){animation-delay:-1.13s}
.wisp:nth-child(3){animation-delay:-2.26s}
.s1{filter:blur(.5px)}
@keyframes wisp{
  0%{opacity:0;transform:translate(0,12px) scale(.9,.7)}
  28%{opacity:.9}
  70%{opacity:.4}
  100%{opacity:0;transform:translate(3px,-24px) scale(1.08,1.15)}
}
.bub{fill:none;stroke:#ABA79F;stroke-width:1.8;transform-box:fill-box;transform-origin:50% 50%;
  opacity:0;animation:bub 2.6s cubic-bezier(.3,0,.3,1) infinite}
.bub:nth-child(2){animation-delay:-.65s}.bub:nth-child(3){animation-delay:-1.3s}.bub:nth-child(4){animation-delay:-1.95s}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.5)}30%{opacity:.95}100%{opacity:0;transform:translateY(-36px) scale(1.15)}}
.curl{fill:none;stroke:#ABA79F;stroke-width:3;stroke-linecap:round;stroke-dasharray:.55 1.6;
  animation:flow 3s cubic-bezier(.4,0,.3,1) infinite}
.curl:nth-child(2){animation-delay:-.2s}
.curl:nth-child(3),.curl:nth-child(4){animation-delay:-1.5s;stroke-width:2.4}
@keyframes flow{0%{stroke-dashoffset:.6;opacity:0}20%{opacity:.95}80%{opacity:.5}100%{stroke-dashoffset:-1.05;opacity:0}}
.tw{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:tw 2.2s cubic-bezier(.4,0,.2,1) infinite}
.tw:nth-child(2){animation-delay:-.55s}.tw:nth-child(3){animation-delay:-1.1s}.tw:nth-child(4){animation-delay:-1.65s}
@keyframes tw{0%{opacity:0;transform:scale(.2) rotate(0)}35%{opacity:1;transform:scale(1) rotate(20deg)}70%,100%{opacity:0;transform:scale(.3) rotate(45deg)}}
.sway{animation:sway 3.6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes sway{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}

/* ---------- selection bar ---------- */
.pickbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.pickbar .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px}
.pickbar .lab{font-size:13px;font-weight:800;letter-spacing:.12em;color:#A9A59D;white-space:nowrap}
.pickbar .dot{width:10px;height:10px;border-radius:50%;background:#4A4843;flex:none;transition:background .3s}
.pickbar.has .dot{background:var(--g);box-shadow:0 0 0 4px rgba(27,138,63,.25)}
.pickbar .val{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickbar .val.bump{animation:bump .5s var(--out)}
@keyframes bump{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){
  .wisp,.bub,.curl,.tw,.sway,.pickbar .val.bump{animation:none!important}
  .wisp,.bub,.tw{opacity:.6}
}
</style>
</head>
<body>

<!-- shared SVG defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

</svg>

<header class="top">
  <div class="eyebrow">EAT MAP · LOADING STUDY</div>
  <h1>EAT MAP ローディング｜クローシュ5案</h1>
  <p class="lead">選んでいただいた「クローシュオープン」を、開き方・湯気・余韻の違う5方向に磨きました。各案の「再生」で、表示時間だけローディングが出てから地図が開く流れを確かめられます。</p>
</header>

<div class="toolbar">
  <div class="in">
    <span class="lab">表示時間</span>
    <div class="seg" role="group" aria-label="表示時間">
      <button type="button" data-d="1200" aria-pressed="false">1.2秒</button>
      <button type="button" data-d="1700" aria-pressed="true">1.7秒</button>
      <button type="button" data-d="2400" aria-pressed="false">2.4秒</button>
    </div>
    <button type="button" class="allplay" id="allplay">全案を再生</button>
  </div>
</div>

<main id="grid"></main>

<div class="pickbar" id="pickbar">
  <div class="in">
    <span class="dot"></span>
    <span class="lab">選択中</span>
    <span class="val" id="pickval">まだ選んでいません</span>
  </div>
</div>

<script>
(() => {
const INK = '#121212', G = '#1B8A3F';
const OPEN = .56;              // ループ周期のうち「開ききる」位置。再生時はここが表示時間の終点になる
let D = 1700;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const EZ = {
  sine:'cubic-bezier(.37,0,.63,1)',
  io:'cubic-bezier(.65,0,.35,1)',
  out:'cubic-bezier(.22,1,.36,1)',
  out5:'cubic-bezier(.16,1,.3,1)',
  grav:'cubic-bezier(.5,0,.75,.35)',

};

/* ---------- 共通の皿 ---------- */
const PLATE = `

const CL = `<use href="#cloche"/>`;
const svg = inner => `<svg viewBox="0 0 240 200" aria-hidden="true">${PLATE}${inner}</svg>`;

/* ---------- 料理 ---------- */

const HAMBURG = `<g class="dish tb" style="transform-origin:120px 168px">

  <path d="M74 150 C74 132 96 124 120 124 C144 124 166 132 166 150 C166 160 146 165 120 165 C94 165 74 160 74 150 Z" fill="#5A4234" stroke="${INK}" stroke-width="1.8"/>

const gyoza = x => `<g transform="translate(${x} 151)">

const GYOZA = `<g class="dish tb" style="transform-origin:120px 168px">

const DON = `<g class="dish tb" style="transform-origin:120px 168px">

const PASTA = `<g class="dish tb" style="transform-origin:120px 168px">

  <path d="M120 122 C112 118 108 112 112 108 C118 110 121 116 120 122 Z" fill="#2C9A50"/>

/* ---------- 光線（案4） ---------- */
const RAYS = (() => {
  let s = '';
  for (let i = 0; i < 7; i++) {
    const a = (-162 + i * 24) * Math.PI / 180;
    const x1 = 120 + Math.cos(a) * 62, y1 = 136 + Math.sin(a) * 62;

  <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".75" y=".75" width="21.5" height="11.5" rx="3.5" stroke="${INK}" stroke-opacity=".4" stroke-width="1.5"/><rect x="3" y="3" width="15" height="7" rx="1.6" fill="${INK}"/><path d="M24 4.5v4" stroke="${INK}" stroke-opacity=".4" stroke-width="1.6" stroke-linecap="round"/></svg>
</span></div>`;

/* ---------- 組み立て ---------- */
const grid = document.getElementById('grid');
const cards = V.map((v,i) => {
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML = `
    <div class="c-head">
      <div class="c-no">案${i+1}<span>${v.en}</span></div>
      <h2>${v.name}</h2>
      <p class="desc">${v.desc}</p>
      <div class="spec">${v.spec.map(s=>`<span>${s}</span>`).join('')}</div>
    </div>
    <div class="phone"><div class="screen">
      <div class="island"></div>${SB}${APP}
      <div class="ov" aria-label="ローディング画面">
        <div class="stage">${v.svg}</div>
        <div class="brand">
          <div class="wm">EAT MAP</div>
          <div class="tag">お店を探しています</div>
          <div class="bar"><i></i></div>
        </div>
      </div>
    </div></div>
    <div class="acts">
      <button type="button" class="btn play">再生</button>
      <button type="button" class="btn pick">これにする</button>
    </div>
    <button type="button" class="back">ループ表示に戻す</button>`;
  grid.appendChild(el);
  const c = {v, i, el, ov:el.querySelector('.ov'), stage:el.querySelector('.stage'), brand:el.querySelector('.brand'),
    app:el.querySelector('.app'), playBtn:el.querySelector('.play'), anims:[], extra:[], timers:[], state:'loop', visible:true};
  c.playBtn.addEventListener('click', () => play(c));
  el.querySelector('.pick').addEventListener('click', () => select(i));
  el.querySelector('.back').addEventListener('click', () => toLoop(c, true));
  return c;
});

/* keyframes: [offset, props, easing] → WAAPI。staggerでオフセットをずらす */
function frames(arr, shift){
  let prev = -1;
  return arr.map(([o,p,e]) => {
    let off = (shift && o > 0 && o < 1) ? Math.min(.995, o + shift) : o;
    if (off <= prev) off = Math.min(1, prev + .001);
    prev = off;
    const k = Object.assign({offset:off}, p);
    if (e) k.easing = e;
    return k;
  });
}
function stopTL(c){ c.anims.forEach(a => a.cancel()); c.anims = []; }
function clearExtra(c){ c.extra.forEach(a => a.cancel()); c.extra = []; c.timers.forEach(clearTimeout); c.timers = []; }
function startTL(c, loop){
  stopTL(c);
  if (reduce) return;
  const opts = {duration: D / OPEN, iterations: loop ? Infinity : 1, fill:'both'};
  [...c.v.tracks, BAR].forEach(t => {
    c.ov.querySelectorAll(t.sel).forEach((node, j) => {
      const a = node.animate(frames(t.f, (t.stagger || 0) * j), opts);
      if (loop && !c.visible) a.pause();
      c.anims.push(a);
    });
  });
}
function ui(c){
  c.playBtn.textContent = c.state === 'playing' ? '再生中…' : c.state === 'shown' ? 'もう一度再生' : `再生（${(D/1000).toFixed(1)}秒）`;
  c.el.classList.toggle('shown', c.state === 'shown');
}
function toLoop(c, fadeIn){
  clearExtra(c);
  c.state = 'loop';
  c.ov.style.visibility = 'visible';
  startTL(c, true);
  if (fadeIn && !reduce) c.extra.push(c.ov.animate([{opacity:0},{opacity:1}], {duration:420, easing:EZ.sine}));
  ui(c);
}
function play(c){
  clearExtra(c);
  c.state = 'playing';
  c.ov.style.visibility = 'visible';
  ui(c);
  startTL(c, false);
  c.timers.push(setTimeout(() => {
    // 表示時間ちょうどで退場開始。中の動きは止めずに減速させて余韻を残す
    c.anims.forEach(a => { try { a.updatePlaybackRate(.35); } catch(_) { a.playbackRate = .35; } });
    const std = EZ.std;
    c.extra.push(c.ov.animate([{opacity:1},{opacity:0}], {duration:reduce?200:580, easing:std, fill:'forwards'}));
    if (!reduce) {
      c.extra.push(c.stage.animate([{transform:'translateY(0px) scale(1)'},{transform:'translateY(-10px) scale(1.07)'}], {duration:760, easing:EZ.out, fill:'forwards'}));
      c.extra.push(c.brand.animate([{opacity:1,transform:'translateY(0px)'},{opacity:0,transform:'translateY(6px)'}], {duration:300, easing:std, fill:'forwards'}));
      c.app.querySelectorAll('.ai').forEach((n, j) => c.extra.push(
        n.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'translateY(0px)'}],
          {duration:680, delay:120 + j*55, easing:EZ.out, fill:'backwards'})));
    }
    c.timers.push(setTimeout(() => {
      stopTL(c);
      c.ov.style.visibility = 'hidden';
      c.state = 'shown';
      ui(c);
    }, reduce ? 220 : 620));
  }, D));
}

/* 画面外のループは止める */
const io = new IntersectionObserver(es => es.forEach(e => {
  const c = cards.find(k => k.el.querySelector('.phone') === e.target);
  if (!c) return;
  c.visible = e.isIntersecting;
  if (c.state === 'loop') c.anims.forEach(a => c.visible ? a.play() : a.pause());
}), {rootMargin:'80px'});
cards.forEach(c => io.observe(c.el.querySelector('.phone')));

/* 表示時間 */
const segBtns = document.querySelectorAll('.seg button');
segBtns.forEach(b => b.addEventListener('click', () => {
  D = +b.dataset.d;
  segBtns.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  cards.forEach(c => { if (c.state === 'loop') startTL(c, true); ui(c); });
  renderPick();
}));
document.getElementById('allplay').addEventListener('click', () => cards.forEach(play));

/* 選択バー */
let sel = null;
try { const s = localStorage.getItem('eatmap-cloche-pick'); if (s !== null && V[+s]) sel = +s; } catch(_) {}
const bar = document.getElementById('pickbar'), val = document.getElementById('pickval');
function renderPick(bump){
  cards.forEach(c => {
    c.el.classList.toggle('sel', c.i === sel);
    c.el.querySelector('.pick').textContent = c.i === sel ? '✓ 選択中' : 'これにする';
  });
  bar.classList.toggle('has', sel !== null);
  val.textContent = sel === null ? 'まだ選んでいません'
    : `案${sel+1}「${V[sel].name}」 · 表示 ${(D/1000).toFixed(1)}秒`;
  if (bump) { val.classList.remove('bump'); void val.offsetWidth; val.classList.add('bump'); }
}
function select(i){
  sel = i;
  try { localStorage.setItem('eatmap-cloche-pick', String(i)); } catch(_) {}
  renderPick(true);
}

cards.forEach(c => toLoop(c, false));
renderPick();
})();
</script>
